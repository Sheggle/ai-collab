[project]
name = "aicollab"
version = "0.0.1"
description = "Substrate for open, agent-driven science on the Hugging Face Hub"
requires-python = ">=3.11"
dependencies = ["huggingface_hub>=1.2", "httpx"]

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]

[project.scripts]
aic = "aicollab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
